name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Собираем сначала VIPCore и VipCoreApi (они не зависят от модулей)
      - name: Build Core and API
        run: |
          dotnet restore VIPCore/VIPCore.sln
          dotnet build VIPCore/VIPCore.sln -c ${{ env.CONFIGURATION }} --no-restore

      # 2. Публикуем ядро (со всеми зависимостями) для артефакта
      - name: Publish VIPCore
        run: |
          dotnet publish VIPCore/VIPCore/VIPCore.csproj -c ${{ env.CONFIGURATION }} -o publish/VIPCore --no-build
          cp -r VIPCore/VIPCore/lang publish/VIPCore/

      # 3. Собираем каждый модуль отдельно, игнорируя ошибки (но фиксируем их)
      - name: Build modules (continue on error)
        continue-on-error: true   # <-- сборка не прервётся, если один модуль упадёт
        run: |
          set -e
          mkdir -p publish/modules
          for proj in VIPCore/modules/*/*.csproj; do
            name=$(basename "$(dirname "$proj")")
            echo "== Building $name =="
            # Восстанавливаем зависимости модуля (они могут ссылаться на VipCoreApi)
            dotnet restore "$proj" || true
            # Собираем модуль. Если ошибка – записываем в лог и переходим к следующему.
            if dotnet build "$proj" -c ${{ env.CONFIGURATION }} --no-restore; then
              echo "✅ $name built successfully"
              # Публикуем модуль со всеми его зависимостями
              dotnet publish "$proj" -c ${{ env.CONFIGURATION }} -o "publish/modules/$name" --no-build
            else
              echo "❌ $name failed to build, skipping"
            fi
          done

      # 4. Артефакт с ядром
      - name: Upload VIPCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore
          path: publish/VIPCore/
          if-no-files-found: error

      # 5. Артефакт со всеми модулями (только те, что удалось собрать)
      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore-Modules
          path: publish/modules/
          if-no-files-found: warn
