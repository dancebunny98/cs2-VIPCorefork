name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Собираем всё решение (ядро, API и модули) вместе
      - name: Restore and build all
        run: |
          dotnet restore VIPCore/VIPCore.sln
          dotnet build VIPCore/VIPCore.sln -c ${{ env.CONFIGURATION }} --no-restore

      # Публикуем ядро (со всеми зависимостями) – для артефакта
      - name: Publish VIPCore
        run: |
          dotnet publish VIPCore/VIPCore/VIPCore.csproj -c ${{ env.CONFIGURATION }} -o publish/VIPCore --no-build
          cp -r VIPCore/VIPCore/lang publish/VIPCore/

      # Копируем только сами модули (DLL + PDB) без зависимостей
      - name: Collect module binaries
        run: |
          mkdir -p publish/modules
          for proj in VIPCore/modules/*/*.csproj; do
            name=$(basename "$(dirname "$proj")")
            echo "== Copying $name =="
            BIN="$(dirname "$proj")/bin/${{ env.CONFIGURATION }}/net8.0"
            if [ -d "$BIN" ]; then
              mkdir -p "publish/modules/$name"
              # Копируем только саму DLL модуля и PDB (если есть)
              cp "$BIN/$name.dll" "publish/modules/$name/" 2>/dev/null || echo "::warning::$name.dll not found"
              cp "$BIN/$name.pdb" "publish/modules/$name/" 2>/dev/null || true
              # Если у модуля есть свои дополнительные ресурсы (например, lang) – копируем их отдельно
              if [ -d "$(dirname "$proj")/lang" ]; then
                cp -r "$(dirname "$proj")/lang" "publish/modules/$name/"
              fi
            else
              echo "::warning::no build output for $name at $BIN"
            fi
          done
          find publish -type f

      # Артефакт для ядра
      - name: Upload VIPCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore
          path: publish/VIPCore/
          if-no-files-found: error

      # Артефакт для модулей (только их DLL, без общих зависимостей)
      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore-Modules
          path: publish/modules/
          if-no-files-found: warn
