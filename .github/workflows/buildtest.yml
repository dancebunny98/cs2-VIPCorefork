name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Добавляем все проекты модулей в решение VIPCore.sln,
      # чтобы они собирались вместе с ядром и API.
      - name: Add modules to solution
        run: |
          for proj in VIPCore/modules/*/*.csproj; do
            dotnet sln VIPCore/VIPCore.sln add "$proj" || true
          done

      - name: Restore
        run: dotnet restore VIPCore/VIPCore.sln

      - name: Build all projects (core, api, modules)
        run: dotnet build VIPCore/VIPCore.sln -c ${{ env.CONFIGURATION }} --no-restore

      # Публикуем основной плагин VIPCore со всеми зависимостями.
      - name: Publish VIPCore
        run: |
          dotnet publish VIPCore/VIPCore/VIPCore.csproj \
            -c ${{ env.CONFIGURATION }} \
            -o publish/VIPCore \
            --no-build
          # Копируем папку с переводами
          cp -r VIPCore/VIPCore/lang publish/VIPCore/

      # Публикуем каждый модуль в отдельную подпапку внутри publish/modules/.
      # --no-build гарантирует, что используются уже собранные бинарники.
      - name: Publish modules
        run: |
          set -e
          mkdir -p publish/modules
          for proj in VIPCore/modules/*/*.csproj; do
            name=$(basename "$(dirname "$proj")")
            echo "Publishing module $name"
            dotnet publish "$proj" \
              -c ${{ env.CONFIGURATION }} \
              -o "publish/modules/$name" \
              --no-build
          done

      # Артефакт для ядра
      - name: Upload VIPCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore
          path: publish/VIPCore/
          if-no-files-found: error

      # Артефакт, содержащий все модули (каждый в своей папке)
      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore-Modules
          path: publish/modules/
          if-no-files-found: warn
