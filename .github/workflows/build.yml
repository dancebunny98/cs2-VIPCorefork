name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - 'RequirmentsApi/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  SHARED_DLLS: "VipCoreApi.dll MenuManagerApi.dll IksAdminApi.dll CS2ScreenMenuAPI.dll LevelsRanksApi.dll FakeRanksApi.dll AnyBaseLib.dll PlayerSettingsApi.dll"

jobs:
  no-tracked-build-output:
    name: Guard against committed build/ output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for tracked build/ directories
        run: |
          tracked=$(git ls-files | grep -E '(^|/)build/' | grep -viE '/readme\.md$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Found build/ output files committed to git - these are generated by 'dotnet build' and must be gitignored, not tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed build/ output files found (README.md inside build/ is allowed)."

  # ------------------------------------------------------------------
  # 1) Сборка VipCoreApi (shared)
  # ------------------------------------------------------------------
  build-vipcoreapi:
    name: Build VipCoreApi
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build
        run: |
          dotnet restore VIPCore/VipCoreApi/VipCoreApi.csproj
          dotnet build VIPCore/VipCoreApi/VipCoreApi.csproj -c ${{ env.CONFIGURATION }} --no-restore
      - name: Collect output
        run: |
          set -e
          SHARED_OUT="out/addons/counterstrikesharp/shared/VipCoreApi"
          mkdir -p "$SHARED_OUT"
          BIN="VIPCore/VipCoreApi/bin/${{ env.CONFIGURATION }}/net8.0"
          cp "$BIN/VipCoreApi.dll" "$SHARED_OUT/"
          [ -f "$BIN/VipCoreApi.pdb" ] && cp "$BIN/VipCoreApi.pdb" "$SHARED_OUT/"
          echo "VipCoreApi collected"
          find out -type f

  # ------------------------------------------------------------------
  # 2) Копирование MenuManagerApi из локального источника в shared/
  #    (без отдельного артефакта – всё складывается в общую папку out/)
  # ------------------------------------------------------------------
  copy-menumanagerapi:
    name: Copy MenuManagerApi to shared
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    steps:
      - uses: actions/checkout@v5
      - name: Locate and copy MenuManagerApi.dll
        run: |
          set -e
          # Ищем файл в нескольких возможных местах
          for loc in "./MenuManagerApi.dll" "./RequirmentsApi/MenuManagerApi.dll" "./VIPCore/MenuManagerApi.dll"; do
            if [ -f "$loc" ]; then
              mkdir -p "out/addons/counterstrikesharp/shared/MenuManagerApi"
              cp "$loc" "out/addons/counterstrikesharp/shared/MenuManagerApi/"
              echo "MenuManagerApi.dll copied from $loc"
              found="yes"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::warning::MenuManagerApi.dll not found, skipping (module menus may fallback to chat)"
          fi
          find out -type f 2>/dev/null || true

  # ------------------------------------------------------------------
  # 3) Сборка VIPCore (ядро) и объединение с shared
  # ------------------------------------------------------------------
  build-vipcore:
    name: Build VIPCore (core)
    runs-on: ubuntu-latest
    needs: [build-vipcoreapi, copy-menumanagerapi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build VIPCore
        run: |
          dotnet restore VIPCore/VIPCore/VIPCore.csproj
          dotnet build VIPCore/VIPCore/VIPCore.csproj -c ${{ env.CONFIGURATION }} --no-restore
      - name: Collect VIPCore output
        run: |
          set -e
          PLUGIN_OUT="out/addons/counterstrikesharp/plugins/VIPCore"
          mkdir -p "$PLUGIN_OUT"
          BIN="VIPCore/VIPCore/bin/${{ env.CONFIGURATION }}/net8.0"

          # Копируем все .dll и .pdb из папки сборки
          find "$BIN" -maxdepth 1 \( -name "*.dll" -o -name "*.pdb" \) -exec cp {} "$PLUGIN_OUT"/ \;

          # Удаляем общие контракты (они уже в shared/)
          for dep in $SHARED_DLLS; do
            f="$PLUGIN_OUT/$dep"
            [ -f "$f" ] && { echo "Removing $dep (must come from shared/)"; rm -f "$f"; }
          done

          # Копируем lang, если есть
          if [ -d "VIPCore/VIPCore/lang" ]; then
            mkdir -p "$PLUGIN_OUT/lang"
            cp VIPCore/VIPCore/lang/*.json "$PLUGIN_OUT/lang"/ 2>/dev/null || true
          fi
          echo "VIPCore collected"
          find out -type f

  # ------------------------------------------------------------------
  # 4) Сборка всех VIP-модулей (лежат в VIPCore/modules/)
  # ------------------------------------------------------------------
  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [build-vipcoreapi, copy-menumanagerapi]
    strategy:
      fail-fast: false
      matrix:
        module:
          - VIP_AntiFlash
          - VIP_Armor
          - VIP_Bhop
          - VIP_BuyTeamWeapon
          - VIP_CustomDefaultAmmo
          - VIP_DamageChange
          - VIP_DecoyTeleport
          - VIP_DefuseKit
          - VIP_Defuser
          - VIP_Endurance
          - VIP_FastDefuse
          - VIP_FastPlant
          - VIP_FastReload
          - VIP_Flags
          - VIP_Fov
          - VIP_Gifts
          - VIP_Gravity
          - VIP_Grenades
          - VIP_GunsPack
          - VIP_Health
          - VIP_Healthshot
          - VIP_InfiniteAmmo
          - VIP_Items
          - VIP_Jumps
          - VIP_KillScreen
          - VIP_Money
          - VIP_NightVip
          - VIP_NoFallDamage
          - VIP_RainbowModel
          - VIP_Random
          - VIP_RegenArmor
          - VIP_RegenHealth
          - VIP_ResetDeaths
          - VIP_Respawn
          - VIP_ShowDamage
          - VIP_SmokeColor
          - VIP_Speed
          - VIP_Tag
          - VIP_TeammatesHeal
          - VIP_Test
          - VIP_Vampirism
          - VIP_VipsOnline
          - VIP_WeaponsMenu
          - VIP_Zeus
          # VIP_ExperienceMultiplier – отдельно ниже (опционально)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build module
        id: build
        continue-on-error: true
        run: |
          set -e
          PROJ="VIPCore/modules/${{ matrix.module }}/${{ matrix.module }}.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore
      - name: Collect module output
        if: steps.build.outcome == 'success'
        run: |
          set -e
          MOD="${{ matrix.module }}"
          PROJDIR="VIPCore/modules/$MOD"
          OUT="out/addons/counterstrikesharp/plugins/$MOD"
          mkdir -p "$OUT"

          DLL=$(find "$PROJDIR" -path '*/obj/*' -prune -o -name "$MOD.dll" -print | head -n1)
          if [ -z "$DLL" ]; then
            echo "::warning::could not locate $MOD.dll after successful build"
            exit 0
          fi

          BIN=$(dirname "$DLL")
          find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
          find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;

          # Удаляем общие контракты
          for dep in $SHARED_DLLS; do
            f="$OUT/$dep"
            [ -f "$f" ] && { echo "Removing $dep (must come from shared/)"; rm -f "$f"; }
          done

          # Копируем lang, если есть
          if [ -d "$PROJDIR/lang" ]; then
            mkdir -p "$OUT/lang"
            cp "$PROJDIR"/lang/*.json "$OUT/lang"/ 2>/dev/null || true
          fi
          echo "$MOD collected"
          find out -type f
      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: echo "::warning::${{ matrix.module }} failed to build - see step log above"

  # ------------------------------------------------------------------
  # 5) VIP_ExperienceMultiplier – опционально, может требовать RanksApi
  # ------------------------------------------------------------------
  build-experience-multiplier:
    name: Build VIP_ExperienceMultiplier (optional)
    runs-on: ubuntu-latest
    needs: [build-vipcoreapi, copy-menumanagerapi]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore & build (allow failure)
        run: |
          PROJ="VIPCore/modules/VIP_ExperienceMultiplier/VIP_ExperienceMultiplier.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ" || true
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore || true

  # ------------------------------------------------------------------
  # 6) ФИНАЛЬНЫЙ АРТЕФАКТ – объединяем всё, что накопилось в out/
  # ------------------------------------------------------------------
  final-artifact:
    name: Upload final VIPCore build
    runs-on: ubuntu-latest
    needs: [build-vipcore, build-modules, build-experience-multiplier]
    # Даже если часть модулей упала, загружаем то, что собралось
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Download all built components
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Merge into one structure
        run: |
          # Структура artifacts содержит папки от каждого задания:
          # VIPCore, VipCoreApi, MenuManagerApi, модули...
          # Мы скопируем всё в единую папку final/
          mkdir -p final/addons/counterstrikesharp

          # Сначала копируем shared от VipCoreApi и MenuManagerApi (они уже лежат в out/ в своих артефактах)
          # Но проще: у нас после всех сборок в каждом артефакте есть папка out/.
          # Мы просто скопируем всё содержимое всех out/ в final.
          # Однако в артефактах могут быть дублирующиеся пути, но это не страшно.
          for dir in artifacts/*/out; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* final/ 2>/dev/null || true
            fi
          done

          # Также если какие-то артефакты не содержат out/ (например, пустые), игнорируем.
          # В результате final/addons/counterstrikesharp будет содержать plugins/ и shared/
          echo "Final structure:"
          find final -type f
      - name: Upload final artifact
        uses: actions/upload-artifact@v6
        with:
          name: VIPCore-${{ github.sha }}
          path: final/
          if-no-files-found: error