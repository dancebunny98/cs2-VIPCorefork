name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # DLL-контракты, которые ДОЛЖНЫ приходить только из shared/<Имя>/ на сервере -
  # никогда не должны лежать копией внутри папки конкретного плагина, иначе это
  # два разных CLR-типа в разных AssemblyLoadContext и капабилити между плагинами
  # ломаются (см. https://docs.counterstrikesharp.dev/ - Shared Plugin API).
  # Используется шагом "Strip shared-contract DLLs" ниже как доп. страховка
  # поверх Private=false в .csproj (тот флаг не всегда транзитивно наследуется).
  SHARED_DLLS: "VipCoreApi.dll MenuManagerApi.dll IksAdminApi.dll CS2ScreenMenuAPI.dll LevelsRanksApi.dll FakeRanksApi.dll AnyBaseLib.dll PlayerSettingsApi.dll"

jobs:
  # ---------------------------------------------------------------
  # 0) Guard: fail fast if anyone commits a build/ output folder again.
  #    CounterStrikeSharp.API's build targets copy every project's compiled
  #    DLLs into <project>/build/addons/counterstrikesharp/plugins/<name>/
  #    on every local `dotnet build`. That's a build artifact, not source -
  #    if it gets committed, people who download the repo can end up
  #    deploying stale DLLs instead of what's actually in the source.
  # ---------------------------------------------------------------
  no-tracked-build-output:
    name: Guard against committed build/ output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for tracked build/ directories
        run: |
          tracked=$(git ls-files | grep -E '(^|/)build/' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Found build/ output files committed to git - these are generated by 'dotnet build' and must be gitignored, not tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed build/ output directories found."

  # ---------------------------------------------------------------
  # 1) VipCoreApi - shared interface library, built on its own first
  # ---------------------------------------------------------------
  build-vipcoreapi:
    name: Build VipCoreApi
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VIPCore/VipCoreApi/VipCoreApi.csproj

      - name: Build
        run: dotnet build VIPCore/VipCoreApi/VipCoreApi.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect output
        run: |
          set -e
          OUT=out/shared/VipCoreApi
          mkdir -p "$OUT"
          BIN="VIPCore/VipCoreApi/bin/${{ env.CONFIGURATION }}/net8.0"
          cp "$BIN"/VipCoreApi.dll "$OUT"/
          [ -f "$BIN/VipCoreApi.pdb" ] && cp "$BIN"/VipCoreApi.pdb "$OUT"/ || true
          find out -type f

      - uses: actions/upload-artifact@v6
        with:
          name: VipCoreApi-${{ github.sha }}
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 2) VIPCore - the core plugin itself
  # ---------------------------------------------------------------
  build-vipcore:
    name: Build VIPCore
    runs-on: ubuntu-latest
    needs: build-vipcoreapi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VIPCore/VIPCore/VIPCore.csproj

      - name: Build
        run: dotnet build VIPCore/VIPCore/VIPCore.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect output
        run: |
          set -e
          OUT=out/addons/counterstrikesharp/plugins/VIPCore
          mkdir -p "$OUT"
          BIN="VIPCore/VIPCore/bin/${{ env.CONFIGURATION }}/net8.0"

          cp "$BIN"/VIPCore.dll "$OUT"/
          [ -f "$BIN/VIPCore.pdb" ] && cp "$BIN"/VIPCore.pdb "$OUT"/ || true

          # VipCoreApi.dll and MenuManagerApi.dll are NOT bundled here (Private=false in
          # VIPCore.csproj) - they must come from shared/VipCoreApi/ and shared/MenuManagerApi/
          # on the server instead, so every plugin sees the same CLR type for these shared
          # contracts. Only genuinely private dependencies get copied into the plugin folder.
          for dep in Dapper.dll MySqlConnector.dll; do
            if [ -f "$BIN/$dep" ]; then
              cp "$BIN/$dep" "$OUT"/
            else
              echo "::warning::$dep not found in VIPCore build output, skipping"
            fi
          done

          cp -r VIPCore/VIPCore/lang "$OUT"/
          find out -type f

      - name: Strip shared-contract DLLs from plugin output
        run: |
          for dep in $SHARED_DLLS; do
            f="out/addons/counterstrikesharp/plugins/VIPCore/$dep"
            [ -f "$f" ] && { echo "Removing bundled $dep - must come from shared/ instead"; rm -f "$f"; }
          done
          true

      - uses: actions/upload-artifact@v6
        with:
          name: VIPCore-${{ github.sha }}
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3) Every VIP_* module, built and packaged INDIVIDUALLY.
  #    One module failing (e.g. a missing external dependency) does
  #    NOT stop the others - it's reported as a warning instead.
  #    Modules use a <ProjectReference> to VipCoreApi/VipCoreApi.csproj
  #    (not a HintPath to a checked-in .dll snapshot), so MSBuild always
  #    rebuilds VipCoreApi from current source as part of each module's
  #    own build - no separate artifact download/swap step needed here.
  # ---------------------------------------------------------------
  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    strategy:
      fail-fast: false
      matrix:
        module:
          - VIP_AntiFlash
          - VIP_Armor
          - VIP_Bhop
          - VIP_BuyTeamWeapon
          - VIP_CustomDefaultAmmo
          - VIP_DamageChange
          - VIP_DecoyTeleport
          - VIP_DefuseKit
          - VIP_Defuser
          - VIP_Endurance
          - VIP_FastDefuse
          - VIP_FastPlant
          - VIP_FastReload
          - VIP_Flags
          - VIP_Fov
          - VIP_Gifts
          - VIP_Gravity
          - VIP_Grenades
          - VIP_GunsPack
          - VIP_Health
          - VIP_Healthshot
          - VIP_InfiniteAmmo
          - VIP_Items
          - VIP_Jumps
          - VIP_KillScreen
          - VIP_Money
          - VIP_NightVip
          - VIP_NoFallDamage
          - VIP_RainbowModel
          - VIP_Random
          - VIP_RegenArmor
          - VIP_RegenHealth
          - VIP_ResetDeaths
          - VIP_Respawn
          - VIP_ShowDamage
          - VIP_SmokeColor
          - VIP_Speed
          - VIP_Tag
          - VIP_TeammatesHeal
          - VIP_Test
          - VIP_Vampirism
          - VIP_VipsOnline
          - VIP_WeaponsMenu
          - VIP_Zeus
          # VIP_ExperienceMultiplier is intentionally excluded - it needs an
          # external RanksApi.dll (github.com/NickFox007/CS2-RanksApi or similar)
          # that isn't part of this repo. See job below.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        id: build
        continue-on-error: true
        run: |
          set -e
          PROJ="VIPCore/modules/${{ matrix.module }}/${{ matrix.module }}.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore

      - name: Collect output
        if: steps.build.outcome == 'success'
        run: |
          set -e
          MOD="${{ matrix.module }}"
          PROJDIR="VIPCore/modules/$MOD"
          OUT="out/addons/counterstrikesharp/plugins/$MOD"
          mkdir -p "$OUT"

          # Output path is not always PROJDIR/bin/Release/net8.0 - some modules
          # (e.g. VIP_DefuseKit) override <OutputPath> in their .csproj. Find the
          # dll wherever it actually landed instead of assuming a fixed path.
          DLL=$(find "$PROJDIR" -path '*/obj/*' -prune -o -name "$MOD.dll" -print | head -n1)

          if [ -z "$DLL" ]; then
            echo "::warning::could not locate $MOD.dll after a successful build"
            exit 0
          fi

          BIN=$(dirname "$DLL")
          find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
          find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;

          # Убираем DLL-контракты, которые должны приходить только из shared/ на сервере
          # (страховка поверх Private=false в .csproj - см. SHARED_DLLS выше).
          for dep in $SHARED_DLLS; do
            f="$OUT/$dep"
            [ -f "$f" ] && { echo "Removing bundled $dep - must come from shared/ instead"; rm -f "$f"; }
          done

          # Per-module translations, if the module ships its own lang/ folder
          if [ -d "$PROJDIR/lang" ]; then
            mkdir -p "$OUT/lang"
            cp "$PROJDIR"/lang/*.json "$OUT/lang"/ 2>/dev/null || true
          fi

          find out -type f

      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: echo "::warning::${{ matrix.module }} failed to build - see the 'Restore & build' step log above"

      - uses: actions/upload-artifact@v6
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.module }}-${{ github.sha }}
          path: out/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 4) VIP_ExperienceMultiplier - kept separate and always allowed to
  #    fail, since it depends on the external RanksApi plugin which
  #    isn't part of this repository (add its .csproj/dll yourself
  #    under VIPCore/modules/VIP_ExperienceMultiplier if you have it).
  # ---------------------------------------------------------------
  build-experience-multiplier:
    name: Build VIP_ExperienceMultiplier (optional, needs RanksApi)
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: |
          PROJ="VIPCore/modules/VIP_ExperienceMultiplier/VIP_ExperienceMultiplier.csproj"
          if [ ! -f "$PROJ" ]; then
            echo "::warning::$PROJ not found, skipping"
            exit 0
          fi
          dotnet restore "$PROJ" || true
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore
