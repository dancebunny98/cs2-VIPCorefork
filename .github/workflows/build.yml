name: Build VIPCore

# Версии, TFM, .NET SDK и номер сборки НЕ задаются здесь:
#   - версии/TFM/зависимости  -> VIPCore/Versions.props (единственное место)
#   - номер сборки            -> github.run_number (передаётся в dotnet build как -p:BuildNumber)
# Итоговая версия каждого запуска: v<PluginVersion>+build.<run_number>

run-name: VIPCore ${{ github.ref_name }} #${{ github.run_number }}

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - 'RequirmentsApi/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Список общих контрактов – они не должны попадать в папки плагинов
  SHARED_DLLS: "VipCoreApi.dll MenuManagerApi.dll IksAdminApi.dll CS2ScreenMenuAPI.dll LevelsRanksApi.dll FakeRanksApi.dll AnyBaseLib.dll PlayerSettingsApi.dll"

jobs:
  # ------------------------------------------------------------------
  # 0) Проверка, что папка build/ не закоммичена
  # ------------------------------------------------------------------
  no-tracked-build-output:
    name: Guard against committed build/ output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for tracked build/ directories
        run: |
          tracked=$(git ls-files | grep -E '(^|/)build/' | grep -viE '/readme\.md$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Found build/ output files committed to git - these are generated by 'dotnet build' and must be gitignored, not tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed build/ output files found (README.md inside build/ is allowed)."

  # ------------------------------------------------------------------
  # 1) Чтение версий из VIPCore/Versions.props + автообнаружение модулей
  # ------------------------------------------------------------------
  prepare:
    name: Read versions (Versions.props)
    runs-on: ubuntu-latest
    needs: no-tracked-build-output
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      full: ${{ steps.v.outputs.full }}
      tfm: ${{ steps.v.outputs.tfm }}
      dotnet: ${{ steps.v.outputs.dotnet }}
      modules: ${{ steps.m.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Versions.props
        id: v
        run: |
          set -e
          f=VIPCore/Versions.props
          get() { sed -n "s:.*<$1>\(.*\)</$1>.*:\1:p" "$f" | head -n1 | tr -d '[:space:]'; }

          version=$(get PluginVersion)
          tfm=$(get DotNetTargetFramework)
          dotnet=$(get DotNetSdkVersion)
          build="${{ github.run_number }}"

          for pair in "PluginVersion=$version" "DotNetTargetFramework=$tfm" "DotNetSdkVersion=$dotnet"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error file=$f::${pair%%=*} is missing or empty in $f"
              exit 1
            fi
          done

          full="v${version}+build.${build}"
          {
            echo "version=$version"
            echo "build=$build"
            echo "full=$full"
            echo "tfm=$tfm"
            echo "dotnet=$dotnet"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## VIPCore $full"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Plugin version | \`$version\` |"
            echo "| Build number | \`$build\` |"
            echo "| Target framework | \`$tfm\` |"
            echo "| .NET SDK | \`$dotnet\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Discover modules
        id: m
        run: |
          set -e
          # Модуль = папка VIPCore/modules/<Name>/ с <Name>.csproj и хотя бы одним .cs.
          # Новые модули подхватываются автоматически - список вручную вести не нужно.
          modules=$(for d in VIPCore/modules/*/; do
            n=$(basename "$d")
            if [ -f "$d$n.csproj" ] && ls "$d"*.cs >/dev/null 2>&1; then echo "\"$n\""; fi
          done | paste -sd, -)
          modules="[$modules]"
          echo "Modules: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 2) Сборка VipCoreApi (shared)
  # ------------------------------------------------------------------
  build-vipcoreapi:
    name: Build VipCoreApi
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.dotnet }}
      - name: Restore & build
        run: |
          dotnet restore VIPCore/VipCoreApi/VipCoreApi.csproj
          dotnet build VIPCore/VipCoreApi/VipCoreApi.csproj -c ${{ env.CONFIGURATION }} --no-restore -p:BuildNumber=${{ needs.prepare.outputs.build }}
      - name: Collect output
        run: |
          set -e
          SHARED_OUT="out/addons/counterstrikesharp/shared/VipCoreApi"
          mkdir -p "$SHARED_OUT"
          BIN="VIPCore/VipCoreApi/bin/${{ env.CONFIGURATION }}/${{ needs.prepare.outputs.tfm }}"
          cp "$BIN/VipCoreApi.dll" "$SHARED_OUT/"
          [ -f "$BIN/VipCoreApi.pdb" ] && cp "$BIN/VipCoreApi.pdb" "$SHARED_OUT/"
          find out -type f
      - uses: actions/upload-artifact@v6
        with:
          name: VipCoreApi
          path: out/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Копирование MenuManagerApi.dll в shared/ (если есть)
  #    Файл ищется в RequirmentsApi/ или корне
  # ------------------------------------------------------------------
  copy-menumanagerapi:
    name: Copy MenuManagerApi to shared
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
      - name: Copy MenuManagerApi.dll
        run: |
          found=""
          for loc in "./MenuManagerApi.dll" "./RequirmentsApi/MenuManagerApi.dll" "./VIPCore/MenuManagerApi.dll"; do
            if [ -f "$loc" ]; then
              mkdir -p "out/addons/counterstrikesharp/shared/MenuManagerApi"
              cp "$loc" "out/addons/counterstrikesharp/shared/MenuManagerApi/"
              echo "MenuManagerApi.dll copied from $loc"
              found="yes"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::warning::MenuManagerApi.dll not found, skipping (module menus may fallback to chat)"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: MenuManagerApi
          path: out/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 4) Сборка VIPCore (ядро)
  #    Копируются все приватные зависимости, общие контракты удаляются.
  # ------------------------------------------------------------------
  build-vipcore:
    name: Build VIPCore
    runs-on: ubuntu-latest
    needs: [prepare, build-vipcoreapi, copy-menumanagerapi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.dotnet }}
      - name: Restore & build
        run: |
          dotnet restore VIPCore/VIPCore/VIPCore.csproj
          dotnet build VIPCore/VIPCore/VIPCore.csproj -c ${{ env.CONFIGURATION }} --no-restore -p:BuildNumber=${{ needs.prepare.outputs.build }}
      - name: Collect output
        run: |
          set -e
          PLUGIN_OUT="out/addons/counterstrikesharp/plugins/VIPCore"
          mkdir -p "$PLUGIN_OUT"
          BIN="VIPCore/VIPCore/bin/${{ env.CONFIGURATION }}/${{ needs.prepare.outputs.tfm }}"

          # Копируем все .dll и .pdb из папки сборки
          find "$BIN" -maxdepth 1 \( -name "*.dll" -o -name "*.pdb" \) -exec cp {} "$PLUGIN_OUT"/ \;

          # Удаляем общие контракты
          for dep in $SHARED_DLLS; do
            f="$PLUGIN_OUT/$dep"
            [ -f "$f" ] && { echo "Removing $dep (must come from shared/)"; rm -f "$f"; }
          done

          # Копируем lang, если есть
          if [ -d "VIPCore/VIPCore/lang" ]; then
            mkdir -p "$PLUGIN_OUT/lang"
            cp VIPCore/VIPCore/lang/*.json "$PLUGIN_OUT/lang"/ 2>/dev/null || true
          fi
          find out -type f
      - uses: actions/upload-artifact@v6
        with:
          name: VIPCore
          path: out/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 5) Сборка всех модулей VIP_* (список строится автоматически в job prepare)
  #    Каждый модуль собирается отдельно, сбой одного не останавливает другие.
  # ------------------------------------------------------------------
  build-modules:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [prepare, build-vipcoreapi, copy-menumanagerapi]
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.prepare.outputs.dotnet }}
      - name: Restore & build
        id: build
        continue-on-error: true
        run: |
          set -e
          PROJ="VIPCore/modules/${{ matrix.module }}/${{ matrix.module }}.csproj"
          dotnet restore "$PROJ"
          dotnet build "$PROJ" -c ${{ env.CONFIGURATION }} --no-restore -p:BuildNumber=${{ needs.prepare.outputs.build }}
      - name: Collect output
        if: steps.build.outcome == 'success'
        run: |
          set -e
          MOD="${{ matrix.module }}"
          PROJDIR="VIPCore/modules/$MOD"
          OUT="out/addons/counterstrikesharp/plugins/$MOD"
          mkdir -p "$OUT"

          DLL=$(find "$PROJDIR" -path '*/obj/*' -prune -o -name "$MOD.dll" -print | head -n1)
          if [ -z "$DLL" ]; then
            echo "::warning::could not locate $MOD.dll after successful build"
            exit 0
          fi

          BIN=$(dirname "$DLL")
          find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
          find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;

          # Удаляем общие контракты
          for dep in $SHARED_DLLS; do
            f="$OUT/$dep"
            [ -f "$f" ] && { echo "Removing $dep (must come from shared/)"; rm -f "$f"; }
          done

          # Копируем lang, если есть
          if [ -d "$PROJDIR/lang" ]; then
            mkdir -p "$OUT/lang"
            cp "$PROJDIR"/lang/*.json "$OUT/lang"/ 2>/dev/null || true
          fi
          find out -type f
      - name: Report failure
        if: steps.build.outcome == 'failure'
        run: echo "::warning::${{ matrix.module }} failed to build - see step log above"
      - uses: actions/upload-artifact@v6
        if: steps.build.outcome == 'success'
        with:
          name: ${{ matrix.module }}
          path: out/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 6) Финальный артефакт: VIPCore-v<версия>-build<номер>
  # ------------------------------------------------------------------
  final-artifact:
    name: Merge and upload final VIPCore build
    runs-on: ubuntu-latest
    needs: [prepare, build-vipcore, build-modules]
    if: always() && needs.prepare.result == 'success' && needs.build-vipcore.result == 'success'
    steps:
      - name: Download all built components
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Merge into one structure
        run: |
          mkdir -p final/addons/counterstrikesharp
          for dir in artifacts/*/addons; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* final/addons/ 2>/dev/null || true
            fi
          done
          cat > final/VERSION.txt <<EOT
          VIPCore ${{ needs.prepare.outputs.full }}
          plugin version : ${{ needs.prepare.outputs.version }}
          build number   : ${{ needs.prepare.outputs.build }}
          target         : ${{ needs.prepare.outputs.tfm }}
          commit         : ${{ github.sha }}
          EOT
          echo "Final structure:"
          find final -type f
      - name: Upload final artifact
        uses: actions/upload-artifact@v6
        with:
          name: VIPCore-v${{ needs.prepare.outputs.version }}-build${{ needs.prepare.outputs.build }}
          path: final/
          if-no-files-found: error
