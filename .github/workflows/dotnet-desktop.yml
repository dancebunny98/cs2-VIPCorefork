name: Build VIPCore

on:
  push:
    branches: [ main ]
    paths:
      - 'VIPCore/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-core:
    name: Build VIPCore core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VIPCore/VIPCore.sln

      - name: Build
        run: dotnet build VIPCore/VIPCore.sln -c ${{ env.CONFIGURATION }} --no-restore

      - name: Package plugin folder
        run: |
          set -e
          OUT=package/addons/counterstrikesharp/plugins/VIPCore
          mkdir -p "$OUT"

          BIN="VIPCore/VIPCore/bin/${{ env.CONFIGURATION }}/net8.0"

          # Main plugin dll + pdb
          cp "$BIN"/VIPCore.dll "$OUT"/
          [ -f "$BIN/VIPCore.pdb" ] && cp "$BIN"/VIPCore.pdb "$OUT"/ || true

          # Dependencies that must ship alongside the plugin
          for dep in VipCoreApi.dll MenuManagerApi.dll Dapper.dll MySqlConnector.dll; do
            if [ -f "$BIN/$dep" ]; then
              cp "$BIN/$dep" "$OUT"/
            else
              echo "::warning::$dep not found in build output, skipping"
            fi
          done

          # Translations
          cp -r VIPCore/VIPCore/lang "$OUT"/

          echo "Packaged files:"
          find package -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore-${{ github.sha }}
          path: package/
          if-no-files-found: error

  build-modules:
    name: Build VIP_* modules
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build every module
        run: |
          set -e
          mkdir -p package
          for proj in VIPCore/modules/*/*.csproj; do
            name=$(basename "$(dirname "$proj")")
            echo "== Building $name =="
            dotnet restore "$proj"
            dotnet build "$proj" -c ${{ env.CONFIGURATION }} --no-restore

            OUT="package/addons/counterstrikesharp/plugins/$name"
            mkdir -p "$OUT"

            BIN="$(dirname "$proj")/bin/${{ env.CONFIGURATION }}/net8.0"
            if [ -d "$BIN" ]; then
              find "$BIN" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT"/ \;
              find "$BIN" -maxdepth 1 -name "*.pdb" -exec cp {} "$OUT"/ \;
            else
              echo "::warning::no build output for $name at $BIN"
            fi
          done
          find package -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIPCore-modules-${{ github.sha }}
          path: package/
          if-no-files-found: warn
